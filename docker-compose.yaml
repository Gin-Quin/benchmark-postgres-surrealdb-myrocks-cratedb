services:
  postgres:
    container_name: benchmark-postgres
    image: postgres:latest
    ports:
      - "5435:5432"
    command: postgres -c max_connections=200
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres

  postgres_oriole:
    container_name: benchmark-postgres-oriole
    image: orioledb/orioledb:latest-pg17
    ports:
      - "5438:5432"
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres

  postgres_timescale:
    container_name: benchmark-postgres-timescale
    image: timescale/timescaledb:latest-pg17
    ports:
      - "54352:5432"
    command: postgres -c max_connections=200
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres

  cedar:
    container_name: benchmark-cedar
    image: cedardb/cedardb:latest
    ports:
      - "5437:5432"
    environment:
      CEDAR_PASSWORD: password

  # myRocks:
  #   container_name: benchmark-myrocks
  #   image: blep/docker-mariadb-myrocks:latest
  #   ports:
  #     - "3306:3306"
  #   environment:
  #     MYSQL_ROOT_PASSWORD: secret

  # crateDB:
  #   container_name: benchmark-cratedb
  #   image: crate:latest
  #   ports:
  #     - "4200:4200"
  #     - "5436:5432"
  #   environment:
  #     CRATE_HEAP_SIZE: 2g

  surrealdb-v3:
    container_name: benchmark-surrealdb-3
    entrypoint:
      - /surreal
      - start
      - --user
      - root
      - --pass
      - root
    image: surrealdb/surrealdb:v3
    volumes:
      - ./surrealdb3:/surrealdb3
    ports:
      - 8001:8000

  surrealdb-v2:
    container_name: benchmark-surrealdb-2
    entrypoint:
      - /surreal
      - start
      - --user
      - root
      - --pass
      - root
    image: surrealdb/surrealdb:v2
    volumes:
      - ./surrealdb:/surrealdb
    ports:
      - 8000:8000

  scylla:
    container_name: benchmark-scylla
    image: scylladb/scylla:latest
    ports:
      - "9042:9042"
      - "9160:9160"

  clickhouse:
    container_name: benchmark-clickhouse
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8124:8123"
      - "9002:9000"
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

